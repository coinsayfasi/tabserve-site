name: TMP Index Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r _automation/google_indexing/requirements.txt
      - name: Check index status
        env:
          GOOGLE_INDEXING_SA: ${{ secrets.GOOGLE_INDEXING_SA }}
        run: |
          python _automation/google_indexing/check_index_status.py --site https://www.tabserve.com.tr --sitemap https://www.tabserve.com.tr/sitemap.xml
