name: TEMP url inspection check
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-auth requests
      - name: Inspect URLs
        env:
          GOOGLE_INDEXING_SA: ${{ secrets.GOOGLE_INDEXING_SA }}
        run: |
          python3 - <<'EOF'
          import os, json
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          urls = [
            "https://www.tabserve.com.tr/",
            "https://gezi.tabserve.com.tr/",
            "https://rentflow.tabserve.com.tr/",
            "https://recipes.tabserve.com.tr/",
            "https://coinsayfasi.github.io/",
          ]
          sa = os.environ["GOOGLE_INDEXING_SA"]
          creds = service_account.Credentials.from_service_account_info(
              json.loads(sa), scopes=["https://www.googleapis.com/auth/webmasters.readonly"])
          s = AuthorizedSession(creds)
          for u in urls:
              body = {"inspectionUrl": u, "siteUrl": "sc-domain:tabserve.com.tr" if "tabserve.com.tr" in u else "https://coinsayfasi.github.io/"}
              r = s.post("https://searchconsole.googleapis.com/v1/urlInspection/index:inspect", json=body, timeout=30)
              print("====", u, "====")
              print(r.status_code)
              try:
                  d = r.json()
                  res = d.get("inspectionResult", {}).get("indexStatusResult", {})
                  print("verdict:", res.get("verdict"))
                  print("coverageState:", res.get("coverageState"))
                  print("lastCrawlTime:", res.get("lastCrawlTime"))
                  print("robotsTxtState:", res.get("robotsTxtState"))
                  print("indexingState:", res.get("indexingState"))
              except Exception as e:
                  print("parse err", e, r.text[:300])
              print()
          EOF
